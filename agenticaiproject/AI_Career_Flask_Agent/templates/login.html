{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <div class="card border-0 shadow p-4">
        <h2 class="fw-bold">Welcome back</h2>
        <p class="text-secondary">Continue your career preparation.</p>
        <form method="post">
            <label class="form-label">Email</label>
            <input class="form-control mb-3" type="email" name="email" required>
            <label class="form-label">Password</label>
            <input class="form-control mb-4" type="password" name="password" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create account</a></p>
    </div>
</div>
{% endblock %}
