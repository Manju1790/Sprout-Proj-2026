{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-9">
<div class="card border-0 shadow-sm p-4">
<h2 class="fw-bold">My Profile</h2>
<p class="text-secondary">Add job-relevant information used by the career agents.</p>
<form method="post">
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Education</label>
<input class="form-control" name="education" value="{{ profile.education if profile else '' }}" placeholder="B.E Computer Science">
</div>
<div class="col-md-6 mb-3">
<label class="form-label">Experience</label>
<input class="form-control" name="experience" value="{{ profile.experience if profile else '' }}" placeholder="Fresher / 2 years">
</div>
</div>
<div class="mb-3">
<label class="form-label">Technical Skills</label>
<textarea class="form-control" name="skills" rows="3" placeholder="Python, SQL, Flask, Git...">{{ profile.skills if profile else '' }}</textarea>
</div>
<div class="mb-3">
<label class="form-label">Target Job Role</label>
<input class="form-control" name="target_role" value="{{ profile.target_role if profile else '' }}" placeholder="Python Developer">
</div>
<div class="mb-4">
<label class="form-label">Projects</label>
<textarea class="form-control" name="projects" rows="5" placeholder="Describe your projects...">{{ profile.projects if profile else '' }}</textarea>
</div>
<button class="btn btn-primary">Save Profile</button>
<a class="btn btn-outline-secondary" href="{{ url_for('resume') }}">Upload Resume</a>
</form>
</div>
</div>
</div>
{% endblock %}
