services:
  - type: web
    name: smart-support-ticket-resolution
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .. && python build_frontend.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
