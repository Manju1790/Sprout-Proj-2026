name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend - Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: smartsupportTicketResolution
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: smartsupportTicketResolution
        run: pytest

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: smartsupportTicketResolution/frontend
        run: npm install

      - name: Run frontend tests
        working-directory: smartsupportTicketResolution/frontend
        run: npm test

      - name: Build frontend
        working-directory: smartsupportTicketResolution/frontend
        run: npm run build
 